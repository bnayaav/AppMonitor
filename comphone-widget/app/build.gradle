plugins { id 'com.android.application' }
android {
    namespace 'com.comphone.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'com.comphone.widget'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }
    signingConfigs {
        fixed { storeFile file('comphone.jks'); storePassword 'comphone123'; keyAlias 'comphone'; keyPassword 'comphone123' }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
