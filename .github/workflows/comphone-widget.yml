name: Build ComPhone Widget APK
on:
  push:
    branches: [ comphone-widget ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comphone-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk comphone-widget.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: comphone-widget-${{ github.run_number }}
          name: ComPhone Widget ${{ github.run_number }}
          files: comphone-widget/comphone-widget.apk
          make_latest: false
